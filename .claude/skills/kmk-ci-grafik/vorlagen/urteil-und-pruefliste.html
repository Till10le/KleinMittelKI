<!-- Urteils-Box: Ja / Nein / Kommt darauf an. Den <style>-Block nur EINMAL pro Beitrag vor der ersten Box einfügen. -->
<style>.content .kmk-verdict{background:#F4F3EE;border-left:4px solid #111;padding:18px 22px 16px;margin:18px 0 26px}.content .kmk-verdict p{margin:0 0 10px!important;font-size:15.5px!important;line-height:1.5!important;color:#111!important}.content .kmk-verdict p:last-child{margin-bottom:0!important}.content .kmk-verdict p.kmk-verdict__q{font-weight:700!important;display:flex;flex-wrap:wrap;align-items:center;gap:10px}.content .kmk-verdict__badge{font-weight:700;font-size:11px;line-height:1;letter-spacing:.12em;text-transform:uppercase;padding:7px 10px}.kmk-verdict__badge--no{background:#E2E1DA;color:#45453F}.kmk-verdict__badge--check{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #111}.kmk-verdict__badge--yes{background:#111;color:#D7FF00}.content .kmk-verdict p.kmk-verdict__label{font-size:11px!important;font-weight:700!important;letter-spacing:.14em!important;text-transform:uppercase;color:#5c5c56!important;margin:14px 0 4px!important}.content .kmk-verdict p.kmk-verdict__quote{font-weight:600!important;background:#fff;padding:10px 14px;border-left:3px solid #D7FF00}.content .kmk-verdict p.kmk-verdict__where{font-size:14px!important;color:#45453F!important}</style>
<div class="kmk-verdict"><p class="kmk-verdict__q">{{FRAGE}} <span class="kmk-verdict__badge kmk-verdict__badge--{{no|check|yes}}">{{Nein|Kommt darauf an|Ja}}</span></p><p>{{BEGRÜNDUNG}}</p><p class="kmk-verdict__label">{{So könnte der Hinweis lauten}}</p><p class="kmk-verdict__quote">„{{BEISPIEL}}“</p><p class="kmk-verdict__where"><strong>Wo:</strong> {{WO}}</p></div>

<!-- Prüfliste: Fälle mit Badge als Überblick. <style> einmal pro Beitrag. -->
<style>.kmk-check__list{margin:18px 0 12px;border-top:1px solid rgba(17,17,17,.14)}.kmk-check__row{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(17,17,17,.14)}.kmk-check__case{margin:0!important;font-size:15.5px!important;line-height:1.35;font-weight:600}.kmk-check__note{display:block;font-weight:400;font-size:13.5px;line-height:1.4;color:var(--c-muted,#5c5c56);margin-top:3px}.kmk-check__badge{font-weight:600;font-size:11px;line-height:1;letter-spacing:.12em;text-transform:uppercase;padding:8px 11px;white-space:nowrap;justify-self:end}.kmk-check__badge--no{background:#E8E7E1;color:#45453F}.kmk-check__badge--check{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #111}.kmk-check__badge--yes{background:#111;color:var(--c-accent,#D7FF00)}@media(max-width:640px){.kmk-check__row{grid-template-columns:1fr}.kmk-check__badge{justify-self:start}}</style>
<figure class="kmk-chart kmk-check"><p class="kmk-chart__kicker">Grafik {{NR}} / Überblick</p><p class="kmk-chart__title">{{FRAGE}}</p><p class="kmk-chart__sub">{{UNTERZEILE}}</p><div class="kmk-check__list"><div class="kmk-check__row"><p class="kmk-check__case">{{FALL}}<span class="kmk-check__note">{{NOTIZ}}</span></p><span class="kmk-check__badge kmk-check__badge--{{no|check|yes}}">{{LABEL}}</span></div></div><figcaption>{{Vereinfachte Orientierung, keine Rechtsberatung. Quelle: …}}</figcaption></figure>
